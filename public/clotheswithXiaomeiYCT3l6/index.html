<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7654bb" />
    <meta name="description" content="Интерактивная игра для практики китайских иероглифов и слов по теме «Одежда»." />
    <meta property="og:title" content="Гардероб Сяомэй — игра по китайскому языку" />
    <meta property="og:description" content="Интерактивная игра для практики китайских иероглифов и слов по теме «Одежда»." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./og.png" />
    <link rel="icon" href="./assets/stickers/star.png" />
    <title>Гардероб Сяомэй — игра по китайскому языку</title>
    <style>:root {
  --ink: #44355f;
  --muted: #796d8e;
  --purple: #7654bb;
  --purple-dark: #5c3da3;
  --purple-soft: #eee8ff;
  --pink: #ff76a8;
  --pink-soft: #fff0f6;
  --blue: #64b7e9;
  --blue-soft: #e9f7ff;
  --yellow: #ffc94c;
  --yellow-soft: #fff8dc;
  --green: #8aca5c;
  --green-soft: #effae8;
  --white: #fffdfd;
  --shadow: 0 22px 70px rgba(99, 69, 142, 0.18);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: #f9f1ff;
}

body {
  margin: 0;
  color: var(--ink);
  background: #f9f1ff;
  font-family:
    "Trebuchet MS", "Segoe UI", Arial, sans-serif;
}

button {
  color: inherit;
  font: inherit;
}

button:focus-visible {
  outline: 4px solid rgba(100, 183, 233, 0.55);
  outline-offset: 3px;
}

.hanzi {
  font-family:
    "KaiTi", "STKaiti", "Microsoft YaHei", "Noto Sans SC", serif;
}

.page-shell {
  position: relative;
  min-height: 100dvh;
  overflow: hidden;
  background:
    linear-gradient(rgba(255, 250, 252, 0.68), rgba(250, 243, 255, 0.82)),
    url("./assets/backgrounds/wardrobe-room.png") center / cover fixed;
}

.page-shell::before {
  position: fixed;
  inset: 0;
  z-index: 0;
  content: "";
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.85), transparent 28%),
    radial-gradient(circle at 82% 16%, rgba(233, 222, 255, 0.7), transparent 24%);
}

.game-app {
  position: relative;
  z-index: 2;
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 42px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  margin-bottom: 18px;
  padding: 12px 20px;
  border: 1px solid rgba(255, 255, 255, 0.78);
  border-radius: 24px;
  background: rgba(255, 253, 254, 0.84);
  box-shadow: 0 12px 34px rgba(104, 72, 147, 0.11);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
}

.brand-mark {
  display: grid;
  width: 48px;
  height: 48px;
  place-items: center;
  border-radius: 16px;
  color: #fff;
  background: linear-gradient(145deg, var(--purple), #9a75dd);
  box-shadow: 0 8px 18px rgba(117, 83, 186, 0.28);
  font-family: "KaiTi", "Microsoft YaHei", serif;
  font-size: 29px;
  font-weight: 700;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-size: 18px;
  line-height: 1.2;
}

.brand small {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.progress-area {
  width: min(390px, 44%);
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.progress-meta strong {
  color: var(--purple-dark);
}

.progress-track {
  height: 12px;
  overflow: hidden;
  border: 2px solid #e8ddf7;
  border-radius: 999px;
  background: #f6f0ff;
}

.progress-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--pink), #f8b452, var(--purple));
  transition: width 0.5s ease;
}

.game-card {
  position: relative;
  min-height: 670px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 38px;
  background: rgba(255, 253, 254, 0.93);
  box-shadow: var(--shadow);
  backdrop-filter: blur(20px);
}

.game-card::before {
  position: absolute;
  inset: 12px;
  z-index: 0;
  content: "";
  pointer-events: none;
  border: 2px dashed rgba(153, 117, 213, 0.2);
  border-radius: 29px;
}

.screen-content,
.intro-layout,
.complete-screen {
  position: relative;
  z-index: 1;
}

.intro-layout {
  display: grid;
  min-height: 670px;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  padding: 66px 64px 54px;
}

.intro-copy {
  position: relative;
  z-index: 2;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 6px 13px;
  border-radius: 999px;
  color: var(--purple-dark);
  background: var(--purple-soft);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.intro-copy h1 {
  max-width: 600px;
  margin: 19px 0 18px;
  color: var(--ink);
  font-size: clamp(44px, 6vw, 74px);
  line-height: 0.98;
  letter-spacing: -0.055em;
}

.intro-copy h1 span {
  display: block;
  margin-top: 10px;
  color: var(--purple);
}

.intro-copy > p {
  max-width: 580px;
  margin: 0;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.65;
}

.lesson-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 25px 0 30px;
}

.lesson-tags span {
  min-width: 62px;
  padding: 9px 13px;
  border: 1px solid #eadff7;
  border-radius: 14px;
  color: var(--purple-dark);
  background: #fff;
  box-shadow: 0 5px 14px rgba(84, 55, 124, 0.08);
  font-family: "KaiTi", "Microsoft YaHei", serif;
  font-size: 21px;
  font-weight: 700;
  text-align: center;
}

.intro-actions,
.complete-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.primary-button,
.sound-button {
  min-height: 54px;
  padding: 0 24px;
  border-radius: 17px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.primary-button {
  border: 0;
  color: white;
  background: linear-gradient(135deg, var(--purple), #956cdb);
  box-shadow: 0 12px 25px rgba(105, 72, 164, 0.3);
}

.primary-button span {
  padding-left: 9px;
  font-size: 21px;
}

.sound-button {
  border: 2px solid #e4d8f4;
  color: var(--purple-dark);
  background: rgba(255, 255, 255, 0.88);
}

.primary-button:hover,
.sound-button:hover,
.answer-button:hover,
.outfit-card:hover,
.picture-card:hover,
.word-card:hover,
.character-tile:hover,
.build-tile:hover {
  transform: translateY(-3px);
}

.primary-button:hover {
  box-shadow: 0 16px 30px rgba(105, 72, 164, 0.35);
}

.best-score {
  margin-top: 17px !important;
  color: var(--purple-dark) !important;
  font-size: 14px !important;
  font-weight: 800;
}

.intro-visual {
  position: relative;
  display: grid;
  min-height: 520px;
  place-items: center;
}

.character-glow {
  position: absolute;
  width: 430px;
  height: 430px;
  border: 2px solid #efe2ff;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 40%, #fff 0, #fff5fa 48%, #eadfff 100%);
  box-shadow:
    inset 0 0 0 16px rgba(255, 255, 255, 0.6),
    0 26px 60px rgba(127, 93, 179, 0.18);
}

.intro-character {
  position: relative;
  z-index: 2;
  width: min(440px, 90%);
  filter: drop-shadow(0 22px 18px rgba(78, 45, 105, 0.14));
  animation: float 4s ease-in-out infinite;
}

.intro-sticker {
  position: absolute;
  z-index: 3;
  filter: drop-shadow(0 8px 12px rgba(92, 58, 136, 0.14));
}

.intro-star {
  top: 48px;
  right: 20px;
  width: 98px;
  rotate: 10deg;
}

.intro-cloud {
  bottom: 56px;
  left: -2px;
  width: 118px;
  rotate: -8deg;
}

.screen-content {
  padding: 38px 46px 46px;
}

.screen-heading {
  max-width: 760px;
  margin: 0 auto 26px;
  text-align: center;
}

.screen-heading h2 {
  margin: 12px 0 8px;
  font-size: clamp(31px, 4vw, 48px);
  line-height: 1.05;
  letter-spacing: -0.035em;
}

.screen-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.55;
}

.matching-board {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 26px;
  align-items: stretch;
}

.picture-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.picture-card {
  position: relative;
  min-height: 174px;
  padding: 10px 10px 12px;
  border: 2px solid #e7dcf4;
  border-radius: 22px;
  background: linear-gradient(145deg, #fff, #fbf8ff);
  cursor: pointer;
  transition: 0.2s ease;
}

.picture-card img {
  display: block;
  width: 126px;
  max-width: 92%;
  height: 126px;
  margin: 0 auto;
  object-fit: contain;
}

.picture-card > span {
  display: block;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.picture-card.is-selected,
.word-card.is-selected {
  border-color: var(--pink);
  background: var(--pink-soft);
  box-shadow: 0 0 0 4px rgba(255, 118, 168, 0.12);
}

.picture-card.is-matched,
.word-card.is-matched {
  border-color: #a4d97f;
  background: var(--green-soft);
  opacity: 0.72;
}

.picture-card:disabled,
.word-choice:disabled {
  cursor: default;
}

.word-list {
  display: grid;
  gap: 10px;
}

.word-card {
  display: grid;
  min-height: 74px;
  grid-template-columns: 1fr 45px;
  align-items: center;
  border: 2px solid #e5daf4;
  border-radius: 19px;
  background: #fff;
  transition: 0.2s ease;
}

.word-choice {
  display: flex;
  align-items: baseline;
  gap: 13px;
  align-self: stretch;
  padding: 8px 0 8px 18px;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
}

.word-choice .hanzi {
  font-size: 31px;
  font-weight: 800;
}

.pinyin {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.mini-sound {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border: 0;
  border-radius: 12px;
  background: var(--blue-soft);
  cursor: pointer;
}

.center-button {
  display: block;
  margin: 24px auto 0;
}

.quiz-layout {
  display: grid;
  max-width: 900px;
  margin: 0 auto;
  grid-template-columns: 0.88fr 1.12fr;
  gap: 38px;
  align-items: center;
}

.action-stage {
  position: relative;
  display: grid;
  min-height: 390px;
  place-items: center;
  border: 2px solid #eadff7;
  border-radius: 30px;
  background:
    radial-gradient(circle at 50% 50%, #fff 0, #fff7fb 58%, #eee7ff 100%);
}

.action-stage img {
  width: min(390px, 96%);
  max-height: 370px;
  object-fit: contain;
  filter: drop-shadow(0 16px 13px rgba(80, 51, 108, 0.13));
}

.stage-spark {
  position: absolute;
  color: var(--pink);
  font-size: 38px;
}

.stage-spark-one {
  top: 26px;
  left: 30px;
}

.stage-spark-two {
  right: 28px;
  bottom: 25px;
  color: var(--blue);
}

.answer-stack {
  display: grid;
  gap: 14px;
}

.answer-button {
  display: grid;
  min-height: 92px;
  grid-template-columns: 1fr 42px;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  border: 2px solid #e6dcf3;
  border-radius: 22px;
  background: #fff;
  box-shadow: 0 8px 22px rgba(96, 65, 135, 0.08);
  transition: 0.2s ease;
  text-align: left;
}

.answer-choice {
  display: grid;
  align-self: stretch;
  grid-template-columns: 45px 1fr;
  gap: 14px;
  align-items: center;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
}

.answer-choice > span {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 14px;
  color: #fff;
  background: linear-gradient(145deg, var(--pink), #f09bc2);
  font-weight: 900;
}

.answer-button:nth-child(2) .answer-choice > span {
  background: linear-gradient(145deg, var(--blue), #8ccff2);
}

.answer-button:nth-child(3) .answer-choice > span {
  background: linear-gradient(145deg, var(--yellow), #ffda71);
}

.answer-choice strong {
  font-size: clamp(27px, 3.5vw, 38px);
  font-weight: 700;
}

.phrase-banner {
  display: flex;
  max-width: 800px;
  min-height: 96px;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 0 auto 20px;
  padding: 14px 22px;
  border: 2px solid #f5c9dc;
  border-radius: 25px;
  background: linear-gradient(135deg, #fff6fa, #fff);
  text-align: center;
}

.phrase-banner strong,
.phrase-banner span {
  display: block;
}

.phrase-banner strong {
  margin-bottom: 5px;
  font-size: clamp(26px, 4vw, 40px);
}

.phrase-banner span {
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.phrase-sound {
  display: grid;
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  place-items: center;
  border: 0;
  border-radius: 16px;
  background: var(--pink-soft);
  cursor: pointer;
}

.outfit-grid {
  display: grid;
  max-width: 880px;
  margin: 0 auto;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.outfit-card {
  position: relative;
  overflow: hidden;
  padding: 12px 12px 15px;
  border: 2px solid #e5daf4;
  border-radius: 26px;
  background:
    radial-gradient(circle at 50% 38%, #fff 0, #fff8fb 60%, #f2ecff 100%);
  cursor: pointer;
  transition: 0.2s ease;
}

.outfit-card:nth-child(2) {
  background:
    radial-gradient(circle at 50% 38%, #fff 0, #fffaf0 60%, #fff0d4 100%);
}

.outfit-card:nth-child(3) {
  background:
    radial-gradient(circle at 50% 38%, #fff 0, #f5fbff 60%, #e8f6ff 100%);
}

.outfit-card img {
  display: block;
  width: 230px;
  max-width: 100%;
  margin: 0 auto;
  filter: drop-shadow(0 14px 12px rgba(80, 51, 108, 0.12));
}

.outfit-card span {
  display: block;
  min-height: 34px;
  padding-top: 2px;
  font-size: 21px;
  font-weight: 700;
}

.detective-layout {
  display: grid;
  max-width: 900px;
  margin: 0 auto;
  grid-template-columns: 0.72fr 1.28fr;
  gap: 30px;
  align-items: center;
}

.detective-guide {
  display: flex;
  align-items: center;
}

.detective-guide > img {
  width: 220px;
  max-width: 60%;
}

.radical-clue {
  position: relative;
  z-index: 2;
  margin-left: -20px;
  padding: 16px 18px;
  border: 2px solid #efddeb;
  border-radius: 22px;
  background: #fff9fc;
  box-shadow: 0 10px 20px rgba(95, 64, 125, 0.1);
  text-align: center;
}

.radical-clue span,
.radical-clue strong {
  display: block;
}

.radical-clue span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.radical-clue strong {
  margin: 5px 0;
  color: var(--purple-dark);
  font-size: 66px;
}

.radical-clue button {
  border: 0;
  color: var(--purple);
  background: transparent;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.character-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.character-tile {
  display: grid;
  aspect-ratio: 1;
  place-items: center;
  border: 2px solid #e6d9f3;
  border-radius: 23px;
  background: #fff;
  box-shadow: 0 8px 18px rgba(91, 61, 131, 0.08);
  font-family: "KaiTi", "Microsoft YaHei", serif;
  font-size: clamp(48px, 6vw, 72px);
  cursor: pointer;
  transition: 0.2s ease;
}

.character-tile.is-selected {
  border-color: var(--pink);
  color: var(--purple-dark);
  background: var(--pink-soft);
  box-shadow: 0 0 0 5px rgba(255, 118, 168, 0.12);
}

.builder-workspace {
  display: grid;
  max-width: 900px;
  margin: 0 auto;
  grid-template-columns: 0.65fr 1.35fr;
  gap: 28px;
  align-items: center;
}

.builder-guide {
  width: 310px;
  max-width: 100%;
  filter: drop-shadow(0 18px 15px rgba(76, 49, 104, 0.13));
}

.builder-game {
  padding: 28px;
  border: 2px solid #e6daf4;
  border-radius: 30px;
  background: linear-gradient(145deg, #fff, #fbf7ff);
  text-align: center;
}

.answer-slots {
  display: flex;
  justify-content: center;
  gap: 14px;
}

.answer-slot {
  display: grid;
  width: 108px;
  height: 108px;
  place-items: center;
  border: 3px dashed #cbb2e8;
  border-radius: 24px;
  color: var(--purple-dark);
  background:
    linear-gradient(45deg, transparent 49%, #f1e8fa 50%, transparent 51%),
    linear-gradient(-45deg, transparent 49%, #f1e8fa 50%, transparent 51%),
    #fff;
  font-size: 66px;
}

.builder-hint {
  margin: 13px 0 20px;
  color: var(--muted);
  font-weight: 800;
}

.tile-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.build-tile {
  display: grid;
  min-height: 88px;
  place-items: center;
  border: 2px solid #efd5e3;
  border-radius: 20px;
  background: var(--pink-soft);
  font-size: 48px;
  cursor: pointer;
  transition: 0.2s ease;
}

.build-tile:disabled {
  opacity: 0.24;
  transform: scale(0.92);
  cursor: default;
}

.answer-button.is-correct,
.outfit-card.is-correct,
.character-tile.is-correct,
.answer-slot.is-correct,
.build-tile.is-correct {
  border-color: #73bd55;
  color: #3f762d;
  background: linear-gradient(145deg, #f7fff2, #e8f8dd);
  box-shadow: 0 0 0 5px rgba(115, 189, 85, 0.15);
  opacity: 1;
}

.answer-button.is-correct .answer-choice > span {
  background: linear-gradient(145deg, #69b94b, #92d276);
}

.answer-button.is-wrong,
.outfit-card.is-wrong,
.character-tile.is-wrong,
.answer-slot.is-wrong,
.build-tile.is-wrong {
  border-color: #ee8aa6;
  color: #a54160;
  background: linear-gradient(145deg, #fff8fa, #ffe7ee);
  box-shadow: 0 0 0 4px rgba(238, 138, 166, 0.12);
  opacity: 1;
}

.answer-button.is-wrong .answer-choice > span {
  background: linear-gradient(145deg, #df688a, #f294af);
}

.compact-sound {
  min-height: 45px;
  margin-top: 18px;
  padding: 0 18px;
  font-size: 13px;
}

.feedback {
  display: flex;
  min-height: 56px;
  align-items: center;
  justify-content: center;
  gap: 11px;
  max-width: 760px;
  margin: 15px auto 0;
  padding: 12px 20px;
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 18px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 10px 25px rgba(88, 57, 127, 0.11);
  backdrop-filter: blur(16px);
  font-size: 14px;
  font-weight: 800;
  text-align: center;
}

.feedback > span {
  display: grid;
  width: 29px;
  height: 29px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  color: white;
  background: var(--purple);
}

.feedback-success {
  color: #4f7638;
  background: rgba(244, 255, 237, 0.94);
}

.feedback-success > span {
  background: var(--green);
}

.feedback-try {
  color: #9c526a;
  background: rgba(255, 242, 247, 0.95);
}

.feedback-try > span {
  background: var(--pink);
}

.complete-screen {
  display: grid;
  min-height: 670px;
  grid-template-columns: 0.9fr 1.1fr;
  align-items: center;
  padding: 48px 70px;
}

.complete-confetti {
  position: absolute;
  top: 10px;
  right: 20px;
  width: 200px;
  opacity: 0.9;
  animation: float 3s ease-in-out infinite;
}

.complete-character-wrap {
  position: relative;
  display: grid;
  place-items: center;
}

.complete-character-wrap::before {
  position: absolute;
  width: 390px;
  height: 390px;
  content: "";
  border-radius: 50%;
  background: radial-gradient(circle, #fff 15%, #fff4fa 54%, #ece1ff 100%);
}

.complete-character {
  position: relative;
  z-index: 1;
  width: min(430px, 100%);
  filter: drop-shadow(0 20px 18px rgba(81, 48, 109, 0.14));
}

.complete-medal {
  position: absolute;
  right: 3%;
  bottom: 7%;
  z-index: 2;
  width: 120px;
  rotate: 9deg;
}

.complete-copy {
  position: relative;
  z-index: 2;
}

.complete-copy h2 {
  margin: 15px 0 13px;
  font-size: clamp(38px, 5vw, 62px);
  line-height: 1.02;
  letter-spacing: -0.045em;
}

.complete-copy > p {
  max-width: 560px;
  margin: 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.6;
}

.result-stars {
  display: flex;
  gap: 8px;
  margin: 22px 0;
}

.result-stars span {
  color: #e5dce8;
  font-size: 48px;
  filter: drop-shadow(0 6px 8px rgba(133, 97, 42, 0.08));
}

.result-stars .earned {
  color: var(--yellow);
  animation: star-pop 0.55s ease both;
}

.result-stars .earned:nth-child(2) {
  animation-delay: 0.12s;
}

.result-stars .earned:nth-child(3) {
  animation-delay: 0.24s;
}

.score-panel {
  display: flex;
  max-width: 450px;
  margin-bottom: 24px;
  padding: 16px 0;
  border-block: 1px solid #e9dff2;
}

.score-panel > div {
  flex: 1;
}

.score-panel > div + div {
  padding-left: 24px;
  border-left: 1px solid #e9dff2;
}

.score-panel span,
.score-panel strong {
  display: block;
}

.score-panel span {
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.score-panel strong {
  color: var(--purple-dark);
  font-size: 28px;
}

.score-panel small {
  color: var(--muted);
  font-size: 14px;
}

.floating-decor {
  position: fixed;
  z-index: 1;
  pointer-events: none;
  opacity: 0.48;
  filter: blur(0.2px);
}

.decor-heart {
  top: 9%;
  left: 2%;
  width: 52px;
  height: 45px;
  rotate: -13deg;
  background: url("./assets/stickers/heart.png") center / contain no-repeat;
}

.decor-star {
  right: 2.5%;
  bottom: 7%;
  width: 70px;
  height: 70px;
  rotate: 12deg;
  background: url("./assets/stickers/star.png") center / contain no-repeat;
}

@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-9px);
  }
}

@keyframes star-pop {
  0% {
    transform: scale(0.45) rotate(-10deg);
  }
  70% {
    transform: scale(1.18) rotate(5deg);
  }
  100% {
    transform: scale(1);
  }
}

@media (max-width: 900px) {
  .intro-layout,
  .complete-screen {
    grid-template-columns: 1fr;
  }

  .intro-layout {
    padding: 46px 40px 30px;
  }

  .intro-copy {
    text-align: center;
  }

  .intro-copy > p {
    margin-inline: auto;
  }

  .lesson-tags,
  .intro-actions {
    justify-content: center;
  }

  .intro-visual {
    min-height: 410px;
  }

  .character-glow {
    width: 350px;
    height: 350px;
  }

  .intro-character {
    width: 380px;
  }

  .matching-board {
    grid-template-columns: 1fr;
  }

  .quiz-layout,
  .detective-layout,
  .builder-workspace {
    grid-template-columns: 1fr;
  }

  .quiz-layout {
    max-width: 680px;
  }

  .action-stage {
    min-height: 330px;
  }

  .action-stage img {
    width: 330px;
  }

  .detective-guide {
    justify-content: center;
  }

  .builder-guide {
    display: none;
  }

  .complete-screen {
    padding: 36px 60px 54px;
    text-align: center;
  }

  .complete-character-wrap {
    max-height: 390px;
  }

  .complete-character {
    width: 350px;
  }

  .complete-copy > p {
    margin-inline: auto;
  }

  .result-stars,
  .complete-actions {
    justify-content: center;
  }

  .score-panel {
    margin-inline: auto;
  }
}

@media (max-width: 640px) {
  .game-app {
    width: min(100% - 16px, 1180px);
    padding: 8px 0 24px;
  }

  .topbar {
    min-height: 66px;
    margin-bottom: 8px;
    padding: 9px 12px;
    border-radius: 19px;
  }

  .brand-mark {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    font-size: 26px;
  }

  .brand strong {
    font-size: 15px;
  }

  .brand small {
    font-size: 10px;
  }

  .progress-area {
    width: 42%;
  }

  .progress-meta {
    font-size: 10px;
  }

  .progress-track {
    height: 10px;
  }

  .game-card {
    min-height: calc(100dvh - 96px);
    border-radius: 25px;
  }

  .game-card::before {
    inset: 7px;
    border-radius: 19px;
  }

  .intro-layout {
    min-height: calc(100dvh - 96px);
    padding: 36px 22px 18px;
  }

  .intro-copy h1 {
    margin-top: 14px;
    font-size: clamp(39px, 13vw, 58px);
  }

  .intro-copy > p {
    font-size: 15px;
    line-height: 1.55;
  }

  .lesson-tags {
    margin: 18px 0 22px;
  }

  .lesson-tags span {
    padding: 7px 10px;
    font-size: 18px;
  }

  .primary-button,
  .sound-button {
    min-height: 50px;
    padding: 0 18px;
    border-radius: 15px;
    font-size: 14px;
  }

  .intro-visual {
    min-height: 320px;
  }

  .character-glow {
    width: 280px;
    height: 280px;
  }

  .intro-character {
    width: 305px;
  }

  .intro-star {
    top: 18px;
    right: 0;
    width: 66px;
  }

  .intro-cloud {
    bottom: 20px;
    left: 0;
    width: 84px;
  }

  .screen-content {
    padding: 27px 16px 30px;
  }

  .screen-heading {
    margin-bottom: 18px;
  }

  .screen-heading h2 {
    margin-top: 9px;
    font-size: 30px;
  }

  .screen-heading p {
    font-size: 14px;
  }

  .picture-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .picture-card {
    min-height: 143px;
    border-radius: 18px;
  }

  .picture-card img {
    width: 102px;
    height: 102px;
  }

  .word-list {
    grid-template-columns: 1fr;
  }

  .word-card {
    min-height: 66px;
  }

  .word-choice .hanzi {
    font-size: 28px;
  }

  .quiz-layout {
    gap: 16px;
  }

  .action-stage {
    min-height: 270px;
    border-radius: 23px;
  }

  .action-stage img {
    width: 270px;
  }

  .answer-stack {
    gap: 9px;
  }

  .answer-button {
    min-height: 76px;
    grid-template-columns: 1fr 38px;
    gap: 9px;
    padding: 9px 11px;
    border-radius: 18px;
  }

  .answer-choice {
    grid-template-columns: 40px 1fr;
    gap: 9px;
  }

  .answer-choice > span {
    width: 38px;
    height: 38px;
  }

  .answer-choice strong {
    font-size: 25px;
  }

  .phrase-banner {
    gap: 10px;
    padding: 12px;
    border-radius: 19px;
  }

  .phrase-banner strong {
    font-size: 24px;
  }

  .phrase-sound {
    width: 40px;
    height: 40px;
  }

  .outfit-grid {
    gap: 8px;
  }

  .outfit-card {
    padding: 8px 5px 10px;
    border-radius: 18px;
  }

  .outfit-card span {
    min-height: 41px;
    font-size: 14px;
  }

  .detective-guide > img {
    width: 180px;
  }

  .radical-clue {
    margin-left: -30px;
    padding: 12px;
  }

  .radical-clue strong {
    font-size: 54px;
  }

  .character-grid {
    gap: 8px;
  }

  .character-tile {
    border-radius: 16px;
    font-size: 44px;
  }

  .builder-game {
    padding: 22px 14px;
    border-radius: 23px;
  }

  .answer-slot {
    width: 88px;
    height: 88px;
    font-size: 54px;
  }

  .tile-row {
    gap: 7px;
  }

  .build-tile {
    min-height: 72px;
    border-radius: 16px;
    font-size: 40px;
  }

  .feedback {
    width: calc(100% - 18px);
    margin-top: 8px;
    font-size: 12px;
  }

  .complete-screen {
    min-height: calc(100dvh - 96px);
    padding: 26px 22px 38px;
  }

  .complete-character-wrap {
    max-height: 310px;
  }

  .complete-character-wrap::before {
    width: 270px;
    height: 270px;
  }

  .complete-character {
    width: 290px;
  }

  .complete-medal {
    right: 9%;
    width: 82px;
  }

  .complete-confetti {
    right: -5px;
    width: 130px;
  }

  .complete-copy h2 {
    margin-top: 10px;
    font-size: 38px;
  }

  .complete-copy > p {
    font-size: 15px;
  }

  .result-stars {
    margin: 14px 0;
  }

  .result-stars span {
    font-size: 40px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
